- name: Install ArgoCD via Helm
  hosts: kubernetes
  become: true

  vars:
    argocd_namespace: argocd
    kubeconfig: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Install Helm if not present
      ansible.builtin.shell:
        cmd: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        creates: /usr/local/bin/helm

    - name: Create argocd namespace
      ansible.builtin.command:
        cmd: kubectl create namespace {{ argocd_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: ns_result
      failed_when: ns_result.rc != 0 and 'already exists' not in ns_result.stderr
      changed_when: ns_result.rc == 0

    - name: Add argo Helm repository
      ansible.builtin.command:
        cmd: helm repo add argo https://argoproj.github.io/argo-helm
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: repo_add
      changed_when: "'already exists' not in repo_add.stdout"
      failed_when: repo_add.rc != 0 and 'already exists' not in repo_add.stderr

    - name: Update Helm repos
      ansible.builtin.command:
        cmd: helm repo update
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    - name: Install ArgoCD via Helm
      ansible.builtin.command:
        cmd: >
          helm upgrade --install argocd argo/argo-cd
          --namespace {{ argocd_namespace }}
          --set 'configs.params.server\.insecure=true'
          --wait
          --timeout 300s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: true

    - name: Apply app-of-apps
      ansible.builtin.command:
        cmd: kubectl apply -f https://raw.githubusercontent.com/NikolayZdravkov/knowledgebase-infra/master/k8s/argocd/app-of-apps.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: true

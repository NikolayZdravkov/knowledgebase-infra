- name: Install ArgoCD
  hosts: kubernetes
  become: true

  tasks:
    - name: Create argocd namespace
      ansible.builtin.command:
        cmd: kubectl create namespace argocd
      register: ns_result
      failed_when: ns_result.rc != 0 and 'already exists' not in ns_result.stderr
      changed_when: ns_result.rc == 0

    - name: Install ArgoCD
      ansible.builtin.command:
        cmd: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      changed_when: true

    - name: Wait for ArgoCD server to be ready
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=180s
      changed_when: false

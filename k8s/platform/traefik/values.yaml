hostNetwork: true

service:
  type: ClusterIP

ports:
  web:
    port: 80
    hostPort: 80
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 443
    hostPort: 443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    tls:
      enabled: true

ingressRoute:
  dashboard:
    enabled: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespaceResources: true
  kubernetesIngress:
    enabled: true

api:
  dashboard: true
  insecure: true

securityContext:
  capabilities:
    add:
      - NET_BIND_SERVICE
  runAsNonRoot: false
  runAsUser: 0

podSecurityContext:
  fsGroup: 0
